<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" role="img" aria-label="Carryoo two-wheeler">
  <rect width="320" height="200" rx="16" fill="#EEF2FF"/>
  <ellipse cx="160" cy="168" rx="110" ry="10" fill="#D8E0F8" opacity=".8"/>
  <!-- rear wheel -->
  <circle cx="95" cy="145" r="28" fill="#1E293B"/>
  <circle cx="95" cy="145" r="14" fill="#94A3B8"/>
  <circle cx="95" cy="145" r="5" fill="#0A57FF"/>
  <!-- front wheel -->
  <circle cx="230" cy="145" r="28" fill="#1E293B"/>
  <circle cx="230" cy="145" r="14" fill="#94A3B8"/>
  <circle cx="230" cy="145" r="5" fill="#0A57FF"/>
  <!-- cargo box -->
  <rect x="70" y="78" width="78" height="52" rx="6" fill="#0A57FF"/>
  <rect x="78" y="86" width="62" height="8" rx="2" fill="#3B82F6"/>
  <text x="109" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">C</text>
  <!-- body -->
  <path d="M145 118h55l18-28h22l8 18v28H145z" fill="#00C2A8"/>
  <path d="M218 90l22 0 10 20h-24z" fill="#0F766E"/>
