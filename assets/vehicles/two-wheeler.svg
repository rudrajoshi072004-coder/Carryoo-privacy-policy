  <rect x="155" y="108" width="42" height="12" rx="4" fill="#040A1A"/>
  <!-- handle -->
  <path d="M240 90c8-12 18-14 28-10" stroke="#040A1A" stroke-width="5" stroke-linecap="round"/>
  <circle cx="268" cy="80" r="5" fill="#040A1A"/>
